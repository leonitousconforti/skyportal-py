name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    # Renovate cannot write a towncrier fragment for its own PRs, so exempt them
    # rather than letting this check block dependency merges.
    if: >-
      ${{ github.event.pull_request.user.login != 'renovate[bot]'
        && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check for changelog fragment
        run: uv run --locked --only-group dev towncrier check --compare-with origin/${{ github.base_ref }}
